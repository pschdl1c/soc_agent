services:
  soc_agent:
    build:
      context: .
      dockerfile: Dockerfile
      # База знаний MITRE ATT&CK собирается на этапе build (scripts/build_kb.py) и вшивается
      # в образ read-only - volume под неё НЕ нужен, обновление = пересборка образа. Закрепить
      # версию для воспроизводимости: ATTACK_STIX_REF (git ref) + ATTACK_STIX_VERSION (напр. 15.1).
      args:
        ATTACK_STIX_REF: master
        ATTACK_STIX_VERSION: ""
    image: soc_agent:latest
    ports:
      - "8000:8000"
    environment:
      SIEM_HOST: "0.0.0.0"
      SIEM_PORT: "8000"
      SIEM_DB_PATH: /app/db/siem.db
      # SIEM_UPLOADS_DIR не задаём - дефолт app/config.py (BASE_DIR/data/uploads) уже
      # резолвится в /app/data/uploads, тот же относительный "data/..." путь, что и при
      # локальном запуске без Docker (см. README §Docker) - явно переопределять незачем.
      # Остальные переменные (SIEM_INGEST_BATCH_SIZE/SIEM_INGEST_FLUSH_INTERVAL и т.п., см.
      # .env.example) - при необходимости добавляй сюда же, они переопределяют дефолты
      # app/config.py.
    volumes:
      # siem.db - именованный volume (не bind-mount): живёт на диске Docker Desktop
      # внутри WSL2-VM. Bind-mount на Windows-хост (D:\...) тут не годится - каждое
      # обращение SQLite (а их на один запрос группировки/фильтра - сотни, json_extract
      # по каждой строке) идёт через границу Windows\WSL2 и даёт ~10x просадку (замеряно:
      # 3.3с vs 0.25с на идентичном файле/запросе). Поэтому siem.db НЕ живёт в общем ./data -
      # локальный (без Docker) запуск и Docker используют РАЗНЫЕ файлы для БД, см. README.
      #
      # uploads/custom_rulesets - тоже именованные volume-ы, не bind-mount. Причина не
      # производительность (эти пути не на горячем пути, редкие целые файлы), а права:
      # Dockerfile чаунит их на непривилегированного app-пользователя на этапе СБОРКИ образа,
      # а bind-mount с хоста при старте контейнера подменял бы каталог целиком вместе с
      # владельцем - на Docker Desktop (Windows/WSL2) хостовые папки, которые Docker создаёт
      # сам при первом `up`, достаются root:root, и app не может в них писать
      # (PermissionError на /ingest/upload). Именованный volume при первой инициализации
      # Docker сам копирует туда содержимое ИЗ ОБРАЗА, включая права - проблема просто не
      # возникает, без доп. скриптов/entrypoint. Обратная сторона - файлы не видны напрямую
      # с хоста (Проводник) и не общие с локальным (без Docker) запуском, как раньше;
      # посмотреть - `docker compose exec soc_agent ls /app/data/uploads` или `docker cp`.
      - siem_db:/app/db
      - siem_uploads:/app/data/uploads
      - siem_custom_rulesets:/app/data/custom_rulesets
      - siem_value_lists:/app/data/value_lists
    restart: unless-stopped

volumes:
  siem_db:
  siem_uploads:
  siem_custom_rulesets:
  siem_value_lists:
