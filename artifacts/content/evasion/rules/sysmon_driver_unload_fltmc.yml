title: Sysmon Driver Unloaded Via Fltmc.EXE
id: 7205d3db-6ef9-4d4c-953d-5346b294e406
name: evasion_sysmon_driver_unload
related:
    -   id: 4931188c-178e-4ee7-a348-39e8a7a56821
        type: similar
    -   id: 4d7cda18-1b12-4e52-b45c-d28653210df8
        type: derived
status: test
description: Detects possible Sysmon filter driver unloaded via fltmc.exe
references:
    - https://www.darkoperator.com/blog/2018/10/5/operating-offensively-against-sysmon
author: Kirill Kiryanov, oscd.community, ET, Claude
date: '2019-10-23'
modified: '2026-09-14'
tags:
    - attack.stealth
    - attack.defense-impairment
    - attack.t1070
    - attack.t1685
    - attack.t1685.001
logsource:
    product: windows
    category: process_creation
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith: \fltMC.exe
        -   OriginalFileName: fltMC.exe
    selection_cli:
        CommandLine|contains|all:
            - unload
            - sysmon
    condition: guard_logsource and (all of selection_*)
falsepositives:
    - Unlikely
level: high
