title: Windows Defender Exclusions Added
id: b1fb4e31-d60a-427d-874c-e61b76143589
name: evasion_defender_exclusion_added
related:
    -   id: 1321dc4e-a1fe-481d-a016-52c45f0c8b4f
        type: derived
status: stable
description: Detects the Setting of Windows Defender Exclusions
references:
    - https://twitter.com/_nullbind/status/1204923340810543109
author: Christian Burkard (Nextron Systems), ET, Claude
date: '2021-07-06'
modified: '2026-09-14'
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    product: windows
    service: windefend
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Windows Defender/Operational
        EventID: 5007
    selection:
        EventID: 5007
        NewValue|contains: \Microsoft\Windows Defender\Exclusions
    condition: guard_logsource and (selection)
falsepositives:
    - Administrator actions
level: medium
