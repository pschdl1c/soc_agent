title: Powershell Defender Exclusion
id: 8b0a3c92-61fa-4a5f-9b98-da9315654cf2
name: evasion_defender_exclusion_cli
related:
    -   id: c1344fa2-323b-4d2e-9176-84b4d4821c88
        type: similar
    -   id: 17769c90-230e-488b-a463-e05c08e9d48f
        type: derived
status: test
description: Detects requests to exclude files, folders or processes from Antivirus scanning using PowerShell cmdlets
references:
    - https://learn.microsoft.com/en-us/defender-endpoint/configure-process-opened-file-exclusions-microsoft-defender-antivirus
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
    - https://twitter.com/AdamTheAnalyst/status/1483497517119590403
author: Florian Roth (Nextron Systems), ET, Claude
date: '2021-04-29'
modified: '2026-09-14'
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection1:
        CommandLine|contains:
            - 'Add-MpPreference '
            - 'Set-MpPreference '
    selection2:
        CommandLine|contains:
            - ' -ExclusionPath '
            - ' -ExclusionExtension '
            - ' -ExclusionProcess '
            - ' -ExclusionIpAddress '
    condition: guard_logsource and (all of selection*)
falsepositives:
    - Possible Admin Activity
    - Other Cmdlets that may use the same parameters
level: medium
