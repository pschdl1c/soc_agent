title: Tamper Windows Defender - ScriptBlockLogging
id: 1dbc9981-098e-4e26-972a-16cb20249019
name: evasion_defender_set_mp_ps
related:
    -   id: ec19ebab-72dc-40e1-9728-4c0b805d722c
        type: derived
    -   id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
        type: derived
status: test
description: Detects PowerShell scripts attempting to disable scheduled scanning and other parts of Windows Defender ATP or set default actions to allow.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
    - https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference?view=windowsserver2022-ps
    - https://bidouillesecurity.com/disable-windows-defender-in-powershell/
author: frack113, elhoim, Tim Shelton (fps, alias support), Swachchhanda Shrawan Poudel, Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: '2022-01-16'
modified: '2026-09-14'
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    guard_logsource:
        Channel: Microsoft-Windows-PowerShell/Operational
        EventID: 4104
    selection_options_disabling_preference:
        ScriptBlockText|contains: Set-MpPreference
    selection_options_disabling_function:
        ScriptBlockText|contains|expand: '%evasion_defender_set_mp_ps_scriptblocktext%'
    selection_other_default_actions_allow:
        ScriptBlockText|contains: Set-MpPreference
    selection_other_default_actions_func:
        ScriptBlockText|contains|expand: '%evasion_defender_set_mp_ps_scriptblocktext2%'
    condition: guard_logsource and (all of selection_options_disabling_* or all of selection_other_default_actions_*)
falsepositives:
    - Legitimate PowerShell scripts that disable Windows Defender for troubleshooting purposes. Must be investigated.
level: high
