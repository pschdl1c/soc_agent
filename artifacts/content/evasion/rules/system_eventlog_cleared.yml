title: Eventlog Cleared
id: 542d1243-06c4-4562-8384-c619052bec4d
name: evasion_system_log_cleared
related:
    - id: a62b37e0-45d3-48d9-a517-90c1a1b0186b
      type: derived
status: experimental
description: |
    One of the Windows event logs has been cleared (System 104). Adapted for the SIEM: Provider_Name is replaced by the
    Channel/EventID guard (104 in System is written only by the Eventlog provider); the name of the cleared log arrives
    from UserData as UserDataChannel, because the record's own Channel ("System") occupies the field name. Core logs
    are covered by "Important Windows Eventlog Cleared".
references:
    - https://twitter.com/deviouspolack/status/832535435960209408
author: Florian Roth (Nextron Systems), ET, Claude
date: 2017-01-10
modified: 2026-09-16
tags:
    - attack.defense-impairment
    - attack.t1685.005
    - car.2016-04-002
logsource:
    product: windows
    service: system
detection:
    selection:
        Channel: System
        EventID: 104
    filter_main_covered:
        UserDataChannel:
            - Microsoft-Windows-PowerShell/Operational
            - Microsoft-Windows-Sysmon/Operational
            - PowerShellCore/Operational
            - Security
            - System
            - Windows PowerShell
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Rollout of log collection agents (the setup routine often includes a reset of the local Eventlog)
    - System provisioning (system reset before the golden image creation)
level: medium
