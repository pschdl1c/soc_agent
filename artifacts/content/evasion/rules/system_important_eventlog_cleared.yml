title: Important Windows Eventlog Cleared
id: e6876969-d18a-4393-9cb5-6c20e63e3eb3
name: evasion_system_important_log_cleared
related:
    - id: 100ef69e-3327-481c-8e5c-6d80d9507556
      type: derived
status: experimental
description: |
    Detects the clearing of one of the Windows core event logs (System 104), e.g. caused by "wevtutil cl" command execution.
    Adapted for the SIEM: Provider_Name is replaced by the Channel/EventID guard; the name of the cleared log is taken
    from UserDataChannel (the record's own Channel is "System").
references:
    - https://twitter.com/deviouspolack/status/832535435960209408
author: Florian Roth (Nextron Systems), Tim Shelton, Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: 2022-05-17
modified: 2026-09-16
tags:
    - attack.defense-impairment
    - attack.t1685.005
    - car.2016-04-002
logsource:
    product: windows
    service: system
detection:
    selection:
        Channel: System
        EventID: 104
        UserDataChannel:
            - Microsoft-Windows-PowerShell/Operational
            - Microsoft-Windows-Sysmon/Operational
            - PowerShellCore/Operational
            - Security
            - System
            - Windows PowerShell
    condition: selection
falsepositives:
    - Rollout of log collection agents (the setup routine often includes a reset of the local Eventlog)
    - System provisioning (system reset before the golden image creation)
level: high
