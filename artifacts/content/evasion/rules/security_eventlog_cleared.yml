status: test
description: |
    The Security event log was cleared (1102). Adapted for the SIEM: the original keys on Provider_Name, which the
    Fluent Bit stack does not deliver (field arrives as ProviderName and Zircolite strips the underscore), so the rule
    keys on the Security channel instead. The legacy 517 variant is dropped - pre-Vista only.
references:
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: Florian Roth (Nextron Systems), ET, Claude
date: 2017-01-10
modified: 2026-09-14
tags:
