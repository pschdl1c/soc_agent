title: Rar Usage with Password and Compression Level
id: 7fc513f7-fee0-4405-906a-3a159cc27593
name: exfil_rar_password
related:
    -   id: faa48cae-6b25-4f00-a094-08947fef582f
        type: derived
status: test
description: Detects the use of rar.exe, on the command line, to create an archive with password protection or with a specific compression level. This is pretty indicative of malicious actions.
references:
    - https://labs.sentinelone.com/the-anatomy-of-an-apt-attack-and-cobaltstrike-beacons-encoded-configuration/
    - https://ss64.com/bash/rar.html
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
author: '@ROxPinTeddy, ET, Claude'
date: '2020-05-12'
modified: '2026-09-14'
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_password:
        CommandLine|contains: ' -hp'
    selection_other:
        CommandLine|contains:
            - ' -m'
            - ' a '
    condition: guard_logsource and (selection_password and selection_other)
falsepositives:
    - Legitimate use of Winrar command line version
    - Other command line tools, that use these flags
level: high
