title: Compress Data and Lock With Password for Exfiltration With WINZIP
id: c8c44038-a052-4e82-a78c-885eabea3029
name: exfil_winzip_password
related:
    -   id: e2e80da2-8c66-4e00-ae3c-2eebd29f6b6d
        type: derived
status: test
description: An adversary may compress or encrypt data that is collected prior to exfiltration using 3rd party utilities
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
author: frack113, ET, Claude
date: '2021-07-27'
modified: '2026-09-14'
tags:
    - attack.collection
    - attack.t1560.001
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_winzip:
        CommandLine|contains:
            - winzip.exe
            - winzip64.exe
    selection_password:
        CommandLine|contains: -s"
    selection_other:
        CommandLine|contains:
            - ' -min '
            - ' -a '
    condition: guard_logsource and (all of selection*)
falsepositives:
    - Unknown
level: medium
