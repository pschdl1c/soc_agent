title: Potential Data Exfiltration Activity Via CommandLine Tools
id: 59c9bcf9-e8e1-423b-bc66-0d7bc80f4c7e
name: exfil_cli_data_exfiltration
related:
    -   id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
        type: derived
status: test
description: Detects the use of various CLI utilities exfiltrating data via web requests
references:
    - https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
author: Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: '2022-08-02'
modified: '2026-09-14'
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_iwr:
        Image|endswith:
            - \powershell_ise.exe
            - \powershell.exe
            - \pwsh.exe
            - \cmd.exe
        CommandLine|contains:
            - 'curl '
            - Invoke-RestMethod
            - Invoke-WebRequest
            - 'irm '
            - 'iwr '
            - 'wget '
        CommandLine|contains|all:
            - ' -ur'
            - ' -me'
            - ' -b'
            - ' POST '
    selection_curl:
        Image|endswith: \curl.exe
        CommandLine|contains: --ur
    selection_curl_data:
        CommandLine|contains:
            - ' -d '
            - ' --data '
    selection_wget:
        Image|endswith: \wget.exe
        CommandLine|contains:
            - --post-data
            - --post-file
    payloads:
        -   CommandLine|re:
                - net\s+view
                - sc\s+query
        -   CommandLine|contains|expand: '%exfil_cli_recon_payloads%'
        -   CommandLine|contains|all:
                - 'type '
                - ' > '
                - ' C:\'
    condition: guard_logsource and ((selection_iwr or all of selection_curl* or selection_wget) and payloads)
falsepositives:
    - Unlikely
level: high
