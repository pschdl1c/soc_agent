      - '\AnyDesk.exe'
      - '\AnyDeskMSI.exe'
      - '\PsExec.exe'
      - '\PsExec64.exe'
      - '\PsExec64a.exe'
      - '\PSEXESVC.exe'
      - '\PAExec.exe'
      - '\assistant.exe'
      - '\assistant_client.exe'
      - '\assistant_service.exe'
      - '\Tb2RCAssist.exe'
      - '\Tb2pro.exe'
      - '\Tb2logon.exe'
      - '\Tb2launch.exe'
      - '\TeamViewer.exe'
      - '\TeamViewer_Service.exe'
      - '\TeamViewer_Desktop.exe'
      - '\winvnc.exe'
      - '\vncserver.exe'
      - '\vncviewer.exe'
      - '\tvnserver.exe'
      - '\tvnviewer.exe'
      - '\uvnc_service.exe'
      - '\Ammyy_Admin.exe'
      - '\radmin.exe'
      - '\radmin3.exe'
      - '\rserver3.exe'
      - '\PDAdmin.exe'
      - '\wfreerdp.exe'
      - '\DWRCS.exe'
      - '\DWRCS64.exe'
      - '\DNTU.exe'
      - '\DNTU64.exe'
      - '\rutserv.exe'
      - '\rfusclient.exe'
      - '\rutview.exe'
