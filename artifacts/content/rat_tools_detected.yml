---
title: DNS Query to RAT and RMM Service Domain
id: a13b95c9-adf6-481c-89ef-29000d15f75c
status: experimental
description: >
  Detects DNS resolution of domains associated with remote access and RMM
  services from non-browser processes. Domain resolution alone does not prove
  that a remote-control session was established.
author: Artem
date: 2026-08-08
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/dns_query/dns_query_win_remote_access_software_domains_non_browsers.yml
  - https://attack.mitre.org/techniques/T1219/002/
tags:
  - attack.command-and-control
  - attack.t1219.002
logsource:
  category: dns_query
  product: windows
detection:
  selection_event:
    EventID: 22
  selection_domain_generic:
    QueryName|endswith:
      # User-provided products with stable vendor infrastructure.
      - 'ammyy.com'
      - 'net.anydesk.com'
      - 'teamviewer.com'
      - 'services.vnc.com'
      - 'remoteutilities.com'
      - 'radmin.com'
      - 'safib.ru'
      - 'xn--80akicokc0aablc.xn--p1ai'

      # Additional remote-access and RMM services.
      - 'control.connectwise.com'
      - 'relay.screenconnect.com'
      - 'api.splashtop.com'
      - 'relay.splashtop.com'
      - 'dwservice.net'
      - 'zohoassist.com'
      - 'assist.zoho.com'
      - 'join.zoho.com'
      - 'logmein.com'
      - 'logmeininc.com'
      - 'logmein-gateway.com'
      - 'remotepc.com'
      - 'netsupportsoftware.com'
      - 'getscreen.me'
      - 'supremocontrol.com'
  selection_domain_rustdesk:
    QueryName|startswith: 'rs-'
    QueryName|endswith: '.rustdesk.com'
  filter_browser:
    Image|endswith:
      - '\chrome.exe'
      - '\firefox.exe'
      - '\msedge.exe'
      - '\msedgewebview2.exe'
      - '\iexplore.exe'
      - '\opera.exe'
      - '\brave.exe'
      - '\vivaldi.exe'
      - '\safari.exe'
      - '\Waterfox.exe'
      - '\Tor Browser\Browser\firefox.exe'
  condition: selection_event and 1 of selection_domain_* and not filter_browser
falsepositives:
  - Approved remote support software contacting vendor infrastructure
  - DNS resolution by software inventory, EDR, proxy, DNS inspection or update services
  - Browsers not included in the filter list
level: medium
