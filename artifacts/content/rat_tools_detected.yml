title: RAT and RMM Tool Process Execution - Windows NewProcessName
id: 651f2190-f967-4a12-b3ea-88c22a92534b
status: experimental
description: >
  Windows Security 4688-compatible variant that detects the same RAT/RMM
  process pool through NewProcessName. It is separate from the Image rule
  because soc_agent may ingest Security events without an Image column.
author: Artem
date: 2026-08-08
references:
  - https://attack.mitre.org/techniques/T1219/002/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a
tags:
  - attack.command-and-control
  - attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_event:
    EventID: 4688
  selection_process:
    NewProcessName|endswith:
      - '\AnyDesk.exe'
      - '\AnyDeskMSI.exe'
      - '\PsExec.exe'
      - '\PsExec64.exe'
      - '\PsExec64a.exe'
      - '\PSEXESVC.exe'
      - '\PAExec.exe'
      - '\assistant.exe'
      - '\assistant_client.exe'
      - '\assistant_service.exe'
      - '\assistant_install_4.exe'
      - '\Tb2RCAssist.exe'
      - '\Tb2pro.exe'
      - '\Tb2logon.exe'
      - '\Tb2launch.exe'
      - '\TeamViewer.exe'
      - '\TeamViewer_Service.exe'
      - '\TeamViewer_Desktop.exe'
      - '\winvnc.exe'
      - '\vncserver.exe'
      - '\vncviewer.exe'
      - '\tvnserver.exe'
      - '\tvnviewer.exe'
      - '\uvnc_service.exe'
      - '\uvnc_settings.exe'
      - '\Ammyy_Admin.exe'
      - '\radmin.exe'
      - '\radmin3.exe'
      - '\rserver3.exe'
      - '\PDAdmin.exe'
      - '\wfreerdp.exe'
      - '\DWRCS.exe'
      - '\DWRCS64.exe'
      - '\DNTU.exe'
      - '\DNTU64.exe'
      - '\rutserv.exe'
      - '\rfusclient.exe'
      - '\rutview.exe'
      - '\rustdesk.exe'
      - '\ScreenConnect.ClientService.exe'
      - '\ScreenConnect.WindowsClient.exe'
      - '\client32.exe'
      - '\meshagent.exe'
      - '\SRManager.exe'
      - '\SRService.exe'
      - '\SplashtopSOS.exe'
      - '\SplashtopStreamer.exe'
      - '\dwagent.exe'
      - '\Supremo.exe'
      - '\SupremoService.exe'
  selection_ammyy_versioned_name:
    NewProcessName|contains: '\AA_v'
    NewProcessName|endswith: '.exe'
  condition: selection_event and (selection_process or selection_ammyy_versioned_name)
falsepositives:
  - Approved remote support, help-desk, system administration and software deployment
  - Legitimate PsExec use by administrators, EDR, inventory or deployment systems
  - Generic file names such as assistant.exe or client32.exe used by unrelated applications
level: medium

