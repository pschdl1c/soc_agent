---
title: AnyDesk Execution With Service or Internal Component Parameters
id: c2e37028-2de7-4604-8d55-2e3691b2531e
status: experimental
description: >
  Detects AnyDesk execution with service, control, backend, proxy, loader or
  shared-memory parameters. These parameters can be legitimate, but provide
  useful context for unattended access and internal component execution.
author: Artem
date: 2026-08-08
references:
  - https://attack.mitre.org/techniques/T1219/002/
tags:
  - attack.command-and-control
  - attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_event:
    EventID:
      - 1
      - 4688
  selection_anydesk_command:
    CommandLine|contains: 'AnyDesk'
  selection_parameter:
    CommandLine|contains:
      - '--control'
      - '--service'
      - '--backend'
      - '--backproxy-system'
      - '--loader'
      - '--shm-id'
  condition: selection_event and selection_anydesk_command and selection_parameter
falsepositives:
  - Normal AnyDesk startup, service mode, update or inter-process communication
level: medium

