title: RAT and RMM Tool Process Execution - Windows Image
id: 08b24aed-788c-4120-b757-5a00607b1041
status: experimental
description: >
  Detects execution of known remote access, remote administration and RMM
  software on Windows. The list includes AnyDesk, PsExec, Assistant, Timbuktu,
  TeamViewer, VNC, Ammyy Admin, Radmin, PDAdmin, FreeRDP, DameWare, Remote
  Utilities/RMS and additional commonly abused RMM tools. This rule detects
  software presence and does not by itself prove malicious use.
author: Artem
date: 2026-08-08
references:
  - https://attack.mitre.org/techniques/T1219/002/
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_anydesk.yml
tags:
  - attack.command-and-control
  - attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_event:
    EventID: 1
  selection_image:
    Image|endswith:
      # AnyDesk.
      - '\AnyDesk.exe'
      - '\AnyDeskMSI.exe'

      # PsExec and compatible implementations.
      - '\PsExec.exe'
      - '\PsExec64.exe'
      - '\PsExec64a.exe'
      - '\PSEXESVC.exe'
      - '\PAExec.exe'

      # Assistant remote access.
      - '\assistant.exe'
      - '\assistant_client.exe'
      - '\assistant_service.exe'
      - '\assistant_install_4.exe'

      # Timbuktu.
      - '\Tb2RCAssist.exe'
      - '\Tb2pro.exe'
      - '\Tb2logon.exe'
      - '\Tb2launch.exe'

      # TeamViewer.
      - '\TeamViewer.exe'
      - '\TeamViewer_Service.exe'
      - '\TeamViewer_Desktop.exe'

      # VNC implementations.
      - '\winvnc.exe'
      - '\vncserver.exe'
      - '\vncviewer.exe'
      - '\tvnserver.exe'
      - '\tvnviewer.exe'
      - '\uvnc_service.exe'
      - '\uvnc_settings.exe'

      # Ammyy Admin.
      - '\Ammyy_Admin.exe'

      # Radmin.
      - '\radmin.exe'
      - '\radmin3.exe'
      - '\rserver3.exe'

      # PDAdmin.
      - '\PDAdmin.exe'

      # FreeRDP.
      - '\wfreerdp.exe'

      # DameWare.
      - '\DWRCS.exe'
      - '\DWRCS64.exe'
      - '\DNTU.exe'
      - '\DNTU64.exe'

      # Remote Utilities / RMS.
      - '\rutserv.exe'
      - '\rfusclient.exe'
      - '\rutview.exe'

      # Additional RMM tools commonly abused by threat actors.
      - '\rustdesk.exe'
      - '\ScreenConnect.ClientService.exe'
      - '\ScreenConnect.WindowsClient.exe'
      - '\client32.exe'
      - '\meshagent.exe'
      - '\SRManager.exe'
      - '\SRService.exe'
      - '\SplashtopSOS.exe'
      - '\SplashtopStreamer.exe'
      - '\dwagent.exe'
      - '\Supremo.exe'
      - '\SupremoService.exe'
  selection_ammyy_versioned_name_image:
    Image|contains: '\AA_v'
    Image|endswith: '.exe'
  condition: selection_event and (selection_image or selection_ammyy_versioned_name_image)
falsepositives:
  - Approved remote support, help-desk, system administration and software deployment
  - Legitimate PsExec use by administrators, EDR, inventory or deployment systems
  - Generic file names such as assistant.exe or client32.exe used by unrelated applications
level: medium

