title: PsExec Service Execution
id: 71dcbe09-d55e-412d-a7fe-efb947cb1399
name: lateral_psexesvc_execution
related:
    -   id: fa91cc36-24c9-41ce-b3c8-3bbc3f2f67ba
        type: obsolete
    -   id: fdfcbd78-48f1-4a4b-90ac-d82241e368c5
        type: derived
status: test
description: Detects launch of the PSEXESVC service, which means that this system was the target of a psexec remote execution
references:
    - https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
    - https://www.youtube.com/watch?v=ro2QuZTIMBM
author: Thomas Patzke, Romaissa Adjailia, Florian Roth (Nextron Systems), ET, Claude
date: '2017-06-12'
modified: '2026-09-14'
tags:
    - attack.execution
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection:
        -   Image: C:\Windows\PSEXESVC.exe
        -   OriginalFileName: psexesvc.exe
    condition: guard_logsource and (selection)
falsepositives:
    - Legitimate administrative tasks
level: medium
