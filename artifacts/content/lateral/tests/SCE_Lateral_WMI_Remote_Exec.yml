scenario: SCE_Lateral_WMI_Remote_Exec
cases:
  - name: positive_logon_then_wmiprvse_cmd_powershell
    expect_incidents: [lateral_wmi_remote_exec]
    events:
      - event: {EventID: 4624, Channel: Security, LogonType: 3, IpAddress: 10.0.2.60, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
      - at: 4
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\cmd.exe', CommandLine: 'cmd.exe /Q /c powershell -nop -c whoami 1> \\127.0.0.1\ADMIN$\__1694 2>&1', ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe', User: 'LAB\admin'}
  - name: negative_local_wmi_child_without_logon
    expect_incidents: []
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\cmd.exe', CommandLine: 'cmd.exe /c powershell -c Get-Date', ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe', User: 'LAB\admin'}
  - name: negative_child_before_logon
    expect_incidents: []
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\cmd.exe', CommandLine: 'cmd.exe /c powershell -c Get-Date', ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'}
      - at: 30
        event: {EventID: 4624, Channel: Security, LogonType: 3, IpAddress: 10.0.2.61, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
lab:
  - 'С второго хоста: wmic /node:<win10-lab> /user:lab\admin process call create "cmd /c powershell -c whoami"'
