title: Recon Tool Execution - Windows Image
name: recon_tools_windows_image
id: fed6cbee-0d82-47c6-b136-d370a4eb1643
status: experimental
description: >
  Base rule that identifies execution of Windows utilities commonly used for
  host, account, process, service, task, registry and network discovery through
  the Image field. It is referenced by the Recon Tools Detected correlation.
author: Artem
date: 2026-08-08
references:
  - https://attack.mitre.org/techniques/T1016/
  - https://attack.mitre.org/techniques/T1018/
  - https://attack.mitre.org/techniques/T1033/
  - https://attack.mitre.org/techniques/T1057/
  - https://attack.mitre.org/techniques/T1069/
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1087/
tags:
  - attack.discovery
  - attack.t1016
  - attack.t1018
  - attack.t1033
  - attack.t1057
  - attack.t1069
  - attack.t1082
  - attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      # Required pool.
      - '\at.exe'
      - '\auditpol.exe'
      - '\chcp.exe'
      - '\hostname.exe'
      - '\ipconfig.exe'
      - '\net.exe'
      - '\netsh.exe'
      - '\netstat.exe'
      - '\nslookup.exe'
      - '\portqry.exe'
      - '\qprocess.exe'
      - '\query.exe'
      - '\quser.exe'
      - '\qwinsta.exe'
      - '\reg.exe'
      - '\regedit.exe'
      - '\route.exe'
      - '\sc.exe'
      - '\schtasks.exe'
      - '\systeminfo.exe'
      - '\taskkill.exe'
      - '\tasklist.exe'
      - '\telnet.exe'
      - '\wevtutil.exe'
      - '\whoami.exe'

      # Additional native discovery utilities.
      - '\arp.exe'
      - '\cmdkey.exe'
      - '\dnscmd.exe'
      - '\driverquery.exe'
      - '\dsquery.exe'
      - '\getmac.exe'
      - '\gpresult.exe'
      - '\klist.exe'
      - '\nbtstat.exe'
      - '\net1.exe'
      - '\nltest.exe'
      - '\pathping.exe'
      - '\ping.exe'
      - '\tracert.exe'
      - '\w32tm.exe'
      - '\wmic.exe'
  condition: selection
falsepositives:
  - Administrative diagnostics, inventory, troubleshooting and support scripts
  - Software deployment, monitoring and endpoint-management agents
level: informational

