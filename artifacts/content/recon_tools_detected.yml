---
title: Recon Tools Detected - Windows Image
id: 52ae06ef-c3a8-4d3a-a08b-bdb26876459c
status: experimental
description: >
  Detects five or more distinct Windows reconnaissance utility executable paths
  in Image on one host during one hour. A separate companion rule records every
  matching process launch for the SIEM event table.
author: Artem
date: 2026-08-08
references:
  - https://attack.mitre.org/techniques/T1016/
  - https://attack.mitre.org/techniques/T1057/
  - https://attack.mitre.org/techniques/T1082/
tags:
  - attack.discovery
  - attack.t1016
  - attack.t1018
  - attack.t1033
  - attack.t1057
  - attack.t1069
  - attack.t1082
  - attack.t1087
correlation:
  type: value_count
  rules:
    - recon_tools_windows_image
  group-by:
    - Computer
  # NOTE: soc_agent's pinned SQLite backend compiles value_count but currently
  # omits the timespan predicate. Until the backend is fixed, the count is
  # limited by the events present in one Zircolite processing batch, not a
  # persistent rolling one-hour window.
  timespan: 1h
  condition:
    # DISTINCT is calculated over the full executable path.
    field: Image
    gte: 5
falsepositives:
  - Helpdesk or administrator performing several diagnostic actions in a short period
  - Inventory, compliance, software deployment and endpoint-management automation
level: medium

