title: PowerShell Hotfix Enumeration
id: 38fadefb-bb98-4f56-b732-aba9de1b5bfd
name: recon_ps_hotfix_enumeration
related:
    - id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
      type: derived
status: test
description: Detects call to "Win32_QuickFixEngineering" in order to enumerate installed hotfixes often used in "enum" scripts by attackers
references:
    - https://github.com/411Hall/JAWS/blob/233f142fcb1488172aa74228a666f6b3c5c48f1d/jaws-enum.ps1
author: Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: 2022-06-21
modified: 2026-09-14
tags:
    - attack.discovery
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    guard_logsource:
        Channel: 'Microsoft-Windows-PowerShell/Operational'
        EventID: 4104
    selection:
        ScriptBlockText|contains|all:
            - 'Win32_QuickFixEngineering'
            - 'HotFixID'
    condition: guard_logsource and (selection)
falsepositives:
    - Legitimate administration scripts
level: medium
