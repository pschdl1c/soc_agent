title: Suspicious Get Information for SMB Share
id: 231e3c35-deff-41d1-8c6e-34aab1417186
name: recon_ps_smb_share_discovery
related:
    - id: 95f0643a-ed40-467c-806b-aac9542ec5ab
      type: derived
status: test
description: |
    Adversaries may look for folders and drives shared on remote systems as a means of identifying sources of information to gather as
    a precursor for Collection and to identify potential systems of interest for Lateral Movement.
    Networks often contain shared network drives and folders that enable users to access file directories on various systems across a network.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md
author: frack113, ET, Claude
date: 2021-12-15
modified: 2026-09-14
tags:
    - attack.discovery
    - attack.t1069.001
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    guard_logsource:
        Channel: 'Microsoft-Windows-PowerShell/Operational'
        EventID: 4104
    selection:
        ScriptBlockText|contains: get-smbshare
    condition: guard_logsource and (selection)
falsepositives:
    - Unknown
level: low
