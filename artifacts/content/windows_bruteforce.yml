title: Windows Brute Force - Ten Failures By Source IP And Account
name: windows_bruteforce_10_by_ip_and_account
id: 5eb79765-b6f5-4d5d-a78e-e379f22d0366
status: experimental
description: Detects at least ten failed Windows authentications from one source IP against one account within five minutes.
author: Artem / OpenAI
date: 2026-08-02
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
correlation:
  type: event_count
  rules:
    - windows_failed_auth_by_ip_and_account
  group-by:
    - IpAddress
    - TargetDomainName
    - TargetUserName
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - A user repeatedly mistyped a password
  - A service is using stale credentials
level: high

