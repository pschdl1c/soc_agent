title: Windows Failed Authentication With Source IP And Account
name: windows_failed_auth_by_ip_and_account
id: 7f0d2153-7b93-4ca4-a937-7380b5e2db43
status: experimental
description: Base selection for failed Windows authentications with a source IP and target account.
author: Artem / OpenAI
date: 2026-08-02
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
    IpAddress|exists: true
    TargetUserName|exists: true
  filter_invalid_ip:
    IpAddress:
      - '-'
      - ''
  filter_invalid_user:
    TargetUserName:
      - '-'
      - ''
  condition: selection and not filter_invalid_ip and not filter_invalid_user
falsepositives:
  - Mistyped passwords
  - Stale saved credentials
level: informational

