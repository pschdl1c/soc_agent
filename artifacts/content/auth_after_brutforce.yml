title: More Than Ten Failed Authentications By Account In One Day
name: auth_after_brutforce_failures_by_account
id: c023ffee-30da-4cb5-ac28-674e5b0d90af
status: experimental
description: Detects more than ten failed authentication events for the same domain account in one day.
author: Artem
date: 2026-08-02
references:
  - https://github.com/pschdl1c/soc_agent/blob/main/docs/sigma-rules-guide.md
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
correlation:
  type: event_count
  rules:
    - auth_after_brutforce_failed_auth
  group-by:
    - TargetDomainName
    - TargetUserName
  timespan: 1d
  condition:
    gte: 10
falsepositives:
  - Password changed while old credentials remain configured on clients or services
  - Shared or service accounts with stale credentials
level: medium

