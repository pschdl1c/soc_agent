title: More Than Ten Failed Authentications By Source IP In One Day
name: auth_after_brutforce_failures_by_ip
id: 19e2d8a4-cc33-4192-8a91-675b4cc73e20
status: experimental
description: Detects more than ten failed authentication events from the same source IP in one day.
author: Artem
date: 2026-08-02
references:
  - https://github.com/pschdl1c/soc_agent/blob/main/docs/sigma-rules-guide.md
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
correlation:
  type: event_count
  rules:
    - auth_after_brutforce_failed_auth
  group-by:
    - IpAddress
  timespan: 1d
  condition:
    gte: 10
falsepositives:
  - Shared NAT addresses
  - Authentication loops caused by stale credentials
level: medium

---
title: auth_after_brutforce By Source IP
name: auth_after_brutforce_by_ip
id: 875d10eb-269e-4154-ad51-94f980af49d8
status: experimental
description: Detects successful authentication from a source IP after more than ten failed attempts from that IP during the preceding day.
author: Artem
date: 2026-08-02
references:
  - https://github.com/pschdl1c/soc_agent/blob/main/docs/sigma-rules-guide.md
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
correlation:
  type: temporal_ordered
  rules:
    - auth_after_brutforce_failures_by_ip
    - auth_after_brutforce_successful_auth
  group-by:
    - IpAddress
  timespan: 1d
falsepositives:
  - Shared NAT addresses used by many legitimate users
  - User corrected a repeatedly mistyped password
level: high

