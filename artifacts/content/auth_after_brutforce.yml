title: Windows Failed Authentication Used By auth_after_brutforce
name: auth_after_brutforce_failed_auth
id: cd444f68-ce2f-49c3-a70c-3ea843f4c26f
status: experimental
description: Base rule for failed Windows authentication events used by auth_after_brutforce correlations.
author: Artem
date: 2026-08-02
references:
  - https://github.com/pschdl1c/soc_agent/blob/main/docs/sigma-rules-guide.md
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
