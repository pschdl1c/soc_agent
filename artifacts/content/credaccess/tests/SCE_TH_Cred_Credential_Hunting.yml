scenario: SCE_TH_Cred_Credential_Hunting
cases:
  - name: positive_cmdkey_and_vaultcmd
    expect_incidents: [th_cred_credential_hunting]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\cmdkey.exe', OriginalFileName: cmdkey.exe, CommandLine: 'cmdkey /list', ParentImage: 'C:\Windows\System32\cmd.exe'}
      - at: 60
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\VaultCmd.exe', OriginalFileName: VAULTCMD.EXE, CommandLine: 'vaultcmd /listcreds:"Windows Credentials" /all', ParentImage: 'C:\Windows\System32\cmd.exe'}
  - name: negative_single_cmdkey
    expect_incidents: []
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\cmdkey.exe', OriginalFileName: cmdkey.exe, CommandLine: 'cmdkey /list', ParentImage: 'C:\Windows\System32\cmd.exe'}
  - name: negative_cmdkey_add
    expect_incidents: []
    events:
      - repeat: 3
        step: 30
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\cmdkey.exe', OriginalFileName: cmdkey.exe, CommandLine: 'cmdkey /add:fileserver /user:LAB\svc /pass:x', ParentImage: 'C:\Windows\System32\cmd.exe'}
lab:
  - 'cmdkey /list; vaultcmd /listcreds:"Windows Credentials" /all; findstr /si password C:\Users\Public\*.txt'
