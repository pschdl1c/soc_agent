logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith: \VaultCmd.exe
        -   OriginalFileName: VAULTCMD.EXE
    selection_cli:
        CommandLine|contains: '/listcreds:'
    condition: guard_logsource and (all of selection*)
falsepositives:
    - Unknown
level: medium
