title: Lsass Memory Dump via Comsvcs DLL
id: d738af87-9db9-40ad-bc6e-6ae028ac9f2c
name: cred_lsass_access_comsvcs
related:
    -   id: a49fa4d5-11db-418c-8473-1e014a8dd462
        type: derived
status: test
description: Detects adversaries leveraging the MiniDump export function from comsvcs.dll via rundll32 to perform a memory dump from lsass.
references:
    - https://twitter.com/shantanukhande/status/1229348874298388484
    - https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), ET, Claude
date: '2020-10-20'
modified: '2026-09-14'
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 10
    selection:
        TargetImage|endswith: \lsass.exe
        SourceImage|endswith: \rundll32.exe
        CallTrace|contains: comsvcs.dll
    condition: guard_logsource and (selection)
falsepositives:
    - Unknown
level: high
