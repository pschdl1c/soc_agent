title: Potential Password Reconnaissance Via Findstr.EXE
id: a8f57f5b-e8f6-45a3-aace-c352349db7be
name: cred_findstr_password_recon
related:
    -   id: 1a0f6f16-2099-4753-9a02-43b6ac7a1fa5
        type: derived
status: test
description: Detects command line usage of "findstr" to search for the "passwords" keyword in a variety of different languages
references:
    - https://steflan-security.com/windows-privilege-escalation-credential-harvesting/
    - https://adsecurity.org/?p=2288
author: Josh Nickels, ET, Claude
date: '2023-05-18'
modified: '2026-09-14'
tags:
    - attack.credential-access
    - attack.t1552.001
    - detection.threat-hunting
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith: \findstr.exe
        -   OriginalFileName: FINDSTR.EXE
    selection_cli:
        CommandLine|contains|expand: '%cred_findstr_password_recon_commandline%'
    condition: guard_logsource and (all of selection_*)
falsepositives:
    - Unknown
level: medium
