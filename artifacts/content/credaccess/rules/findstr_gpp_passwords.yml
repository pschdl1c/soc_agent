title: Findstr GPP Passwords
id: 0066dcd2-990a-40af-8765-028886a800a3
name: cred_findstr_gpp_passwords
related:
    -   id: 91a2c315-9ee6-4052-a853-6f6a8238f90d
        type: derived
status: test
description: Look for the encrypted cpassword value within Group Policy Preference files on the Domain Controller. This value can be decrypted with gpp-decrypt.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.006/T1552.006.md#atomic-test-1---gpp-passwords-findstr
author: frack113, ET, Claude
date: '2021-12-27'
modified: '2026-09-14'
tags:
    - attack.credential-access
    - attack.t1552.006
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith:
                - \find.exe
                - \findstr.exe
        -   OriginalFileName:
                - FIND.EXE
                - FINDSTR.EXE
    selection_cli:
        CommandLine|contains|all:
            - cpassword
            - \sysvol\
            - .xml
    condition: guard_logsource and (all of selection_*)
falsepositives:
    - Unknown
level: high
