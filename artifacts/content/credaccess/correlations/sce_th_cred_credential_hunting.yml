title: SCE_TH_Cred_Credential_Hunting
id: 693774a2-2608-4a41-aead-9e428629ff61
name: sce_th_cred_credential_hunting
status: experimental
description: |
    Hunting: two or more credential hunting actions on the host within 30 minutes - findstr for
    passwords or GPP cpassword, cmdkey /list, vaultcmd listing.
author: ET, Claude
date: 2026-09-14
tags:
    - attack.credential-access
    - attack.t1552.001
    - attack.t1555.004
correlation:
    type: event_count
    rules:
        - cred_findstr_password_recon
        - cred_cmdkey_recon
        - cred_vaultcmd_list
        - cred_findstr_gpp_passwords
    group-by:
        - Computer
    timespan: 30m
    condition:
        gte: 2
    incident:
        type: th_cred_credential_hunting
        severity: low
falsepositives:
    - Administrators auditing stored credentials
level: low
