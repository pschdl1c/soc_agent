scenario: SCE_Impact_Ransomware_Preparation
cases:
  - name: positive_vssadmin_and_bcdedit
    expect_incidents: [impact_ransomware_preparation, impact_shadow_copy_deletion]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\vssadmin.exe', OriginalFileName: VSSADMIN.EXE, CommandLine: 'vssadmin.exe delete shadows /all /quiet', ParentImage: 'C:\Windows\System32\cmd.exe', IntegrityLevel: High}
      - at: 20
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\bcdedit.exe', OriginalFileName: bcdedit.exe, CommandLine: 'bcdedit /set {default} recoveryenabled no', ParentImage: 'C:\Windows\System32\cmd.exe', IntegrityLevel: High}
  - name: positive_wbadmin_and_reagentc
    expect_incidents: [impact_ransomware_preparation]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\wbadmin.exe', OriginalFileName: WBADMIN.EXE, CommandLine: 'wbadmin delete backup -keepVersions:0 -quiet', ParentImage: 'C:\Windows\System32\cmd.exe'}
      - at: 30
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\ReAgentc.exe', OriginalFileName: reagentc.exe, CommandLine: 'reagentc.exe /disable', ParentImage: 'C:\Windows\System32\cmd.exe'}
  - name: negative_shadow_deletion_process_and_scriptblock_count_once
    # один приём (удаление теневых копий) виден и в Sysmon 1, и в 4104 - это не "два разных действия"
    expect_incidents: [impact_shadow_copy_deletion]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', OriginalFileName: PowerShell.EXE, CommandLine: 'powershell "Get-WmiObject Win32_ShadowCopy | ForEach-Object { $_.Delete() }"', ParentImage: 'C:\Windows\System32\cmd.exe'}
      - at: 1
        event: {EventID: 4104, Channel: Microsoft-Windows-PowerShell/Operational, ScriptBlockText: 'Get-WmiObject Win32_ShadowCopy | ForEach-Object { $_.Delete() }'}
  - name: negative_vssadmin_list
    expect_incidents: []
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\vssadmin.exe', OriginalFileName: VSSADMIN.EXE, CommandLine: 'vssadmin list shadows', ParentImage: 'C:\Windows\System32\cmd.exe'}
lab:
  - 'Только на снимке ВМ: vssadmin delete shadows /all /quiet; bcdedit /set {default} recoveryenabled no'
  - 'Откат: bcdedit /set {default} recoveryenabled yes'
