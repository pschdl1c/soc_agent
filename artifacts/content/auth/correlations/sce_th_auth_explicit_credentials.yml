title: SCE_TH_Auth_Explicit_Credentials
id: fd6ad6c3-7e20-4f0c-9151-bf7767544d6b
name: sce_th_auth_explicit_credentials
status: experimental
description: |
    Hunting: one logged-on account supplies explicit credentials of 3 or more other accounts on a
    host within 30 minutes (4648) - credential testing with runas / net use / tooling.
author: ET, Claude
date: 2026-09-14
tags:
    - attack.lateral-movement
    - attack.credential-access
    - attack.t1078
    - attack.t1110
correlation:
    type: value_count
    rules:
        - auth_explicit_credentials
    group-by:
        - Computer
        - SubjectUserName
    timespan: 30m
    condition:
        field: TargetUserName
        gte: 3
    incident:
        type: th_auth_explicit_credentials
        severity: low
falsepositives:
    - Administrators switching between several admin accounts
level: low
