title: SCE_Auth_PasswordSpray
id: 63190b5f-8ea4-473c-9156-c97ef53259d4
name: sce_auth_password_spray
status: experimental
description: |
    Password spraying against a host: failed logons for 5 or more distinct accounts from one
    source address within 10 minutes.
author: ET, Claude
date: 2026-09-14
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - auth_failed_logon
    group-by:
        - Computer
        - IpAddress
    timespan: 10m
    condition:
        field: TargetUserName
        gte: 5
    incident:
        type: auth_password_spray
        severity: high
falsepositives:
    - Jump host or terminal server where many users mistype passwords
level: high
