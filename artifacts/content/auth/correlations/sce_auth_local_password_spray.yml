title: SCE_Auth_Local_PasswordSpray
id: 21a16544-ab42-46a5-8736-a24175f441a7
name: sce_auth_local_password_spray
status: experimental
description: |
    Password spraying on a host without a source address: failed logons of 5 or more distinct
    accounts within 10 minutes, none of them carrying a client address - local tooling cycling
    through account names via the LogonUser API. Spraying from a network address is
    SCE_Auth_PasswordSpray.
author: ET, Claude
date: 2026-09-16
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - auth_failed_logon_no_address
    group-by:
        - Computer
    timespan: 10m
    condition:
        field: TargetUserName
        gte: 5
    incident:
        type: auth_local_password_spray
        severity: high
falsepositives:
    - Shared kiosk or classroom machine where many users mistype passwords
level: high
