scenario: SCE_Auth_BruteForce_Success
cases:
  - name: positive_burst_then_success
    expect_incidents: [auth_bruteforce_success]
    events:
      - repeat: 12
        step: 4
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 198.51.100.7, TargetUserName: admin}
      - at: 90
        event: {EventID: 4624, Channel: Security, LogonType: 3, IpAddress: 198.51.100.7, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
  - name: positive_long_burst_raises_both_incidents
    expect_incidents: [auth_bruteforce, auth_bruteforce_success]
    events:
      - repeat: 25
        step: 2
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 198.51.100.8, TargetUserName: admin}
      - at: 120
        event: {EventID: 4624, Channel: Security, LogonType: 10, IpAddress: 198.51.100.8, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
  - name: positive_success_arrives_in_later_flush
    expect_incidents: [auth_bruteforce_success]
    events:
      - repeat: 12
        step: 4
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 198.51.100.9, TargetUserName: admin}
      - at: 300
        phase: 2
        event: {EventID: 4624, Channel: Security, LogonType: 3, IpAddress: 198.51.100.9, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
  - name: negative_success_before_failures
    expect_incidents: []
    events:
      - event: {EventID: 4624, Channel: Security, LogonType: 3, IpAddress: 198.51.100.10, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
      - at: 30
        repeat: 12
        step: 4
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 198.51.100.10, TargetUserName: admin}
  - name: negative_success_from_other_address
    expect_incidents: []
    events:
      - repeat: 12
        step: 4
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 198.51.100.11, TargetUserName: admin}
      - at: 90
        event: {EventID: 4624, Channel: Security, LogonType: 3, IpAddress: 198.51.100.12, TargetUserName: admin, TargetUserSid: "S-1-5-21-1-2-3-500"}
  - name: negative_service_logon_after_burst
    expect_incidents: []
    events:
      - repeat: 12
        step: 4
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 198.51.100.13, TargetUserName: admin}
      - at: 90
        event: {EventID: 4624, Channel: Security, LogonType: 5, IpAddress: 198.51.100.13, TargetUserName: СИСТЕМА, TargetUserSid: "S-1-5-18"}
lab:
  - 'net user hacker P@ssw0rd123 /add'
  - '1..12 | ForEach-Object { cmd /c "net use \\127.0.0.1\IPC$ /delete /y >nul 2>&1 & net use \\127.0.0.1\IPC$ /user:$env:COMPUTERNAME\hacker WrongPass$_" 2>$null | Out-Null }'
  - 'cmd /c "net use \\127.0.0.1\IPC$ /delete /y >nul 2>&1 & net use \\127.0.0.1\IPC$ /user:%COMPUTERNAME%\hacker P@ssw0rd123"'
  - 'net user hacker /delete'
