scenario: SCE_Auth_PasswordSpray
cases:
  - name: positive_6_accounts_from_one_address
    expect_incidents: [auth_password_spray]
    events:
      - repeat: 6
        step: 15
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 192.0.2.44, TargetUserName: "user${i}"}
  - name: negative_4_accounts
    expect_incidents: []
    events:
      - repeat: 4
        step: 15
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 192.0.2.44, TargetUserName: "user${i}"}
  - name: negative_accounts_spread_over_addresses
    expect_incidents: []
    events:
      - repeat: 6
        step: 15
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: "192.0.2.${i}", TargetUserName: "user${i}"}
lab:
  - 'foreach ($u in "adm","backup","sql","test","guest2","svc") { cmd /c "net use \\127.0.0.1\IPC$ /delete /y >nul 2>&1 & net use \\127.0.0.1\IPC$ /user:$env:COMPUTERNAME\$u Winter2026!" 2>$null | Out-Null }'
