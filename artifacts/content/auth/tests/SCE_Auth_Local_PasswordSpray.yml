scenario: SCE_Auth_Local_PasswordSpray
cases:
  - name: positive_6_accounts_without_address
    expect_incidents: [auth_local_password_spray]
    events:
      - repeat: 6
        step: 20
        event: {EventID: 4625, Channel: Security, LogonType: 2, IpAddress: "-", TargetUserName: "user${i}"}
  - name: negative_4_accounts
    expect_incidents: []
    events:
      - repeat: 4
        step: 20
        event: {EventID: 4625, Channel: Security, LogonType: 2, IpAddress: "-", TargetUserName: "user${i}"}
  - name: negative_accounts_over_network_address
    expect_incidents: [auth_password_spray]
    events:
      - repeat: 6
        step: 20
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: 192.0.2.60, TargetUserName: "user${i}"}
  - name: negative_machine_accounts
    expect_incidents: []
    events:
      - repeat: 6
        step: 20
        event: {EventID: 4625, Channel: Security, LogonType: 3, IpAddress: "-", TargetUserName: "SRV${i}$"}
lab:
  - 'foreach ($u in "adm","backup","sql","test","guest2","svc") { $p = ConvertTo-SecureString "Winter2026!" -AsPlainText -Force; try { Start-Process cmd.exe -Credential (New-Object pscredential $u, $p) -ArgumentList "/c exit" -ErrorAction Stop } catch {} }'
