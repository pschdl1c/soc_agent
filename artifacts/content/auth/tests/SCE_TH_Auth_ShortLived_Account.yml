      - event: {EventID: 4726, Channel: Security, TargetUserName: old_user, TargetSid: "S-1-5-21-1-2-3-1002", SubjectUserName: workstation_x}
lab:
  - 'net user tmp_ops P@ssw0rd123 /add'
  - 'net user tmp_ops /delete'
