    expect_incidents: [th_auth_shortlived_account]
    events:
      - event: {EventID: 4720, Channel: Security, TargetUserName: tmp_ops, TargetSid: "S-1-5-21-1-2-3-1011", SubjectUserName: workstation_x}
      - at: 1800
        event: {EventID: 4726, Channel: Security, TargetUserName: tmp_ops, TargetSid: "S-1-5-21-1-2-3-1011", SubjectUserName: workstation_x}
