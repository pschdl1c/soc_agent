scenario: SCE_TH_Auth_Explicit_Credentials
cases:
  - name: positive_three_foreign_accounts
    expect_incidents: [th_auth_explicit_credentials]
    events:
      - repeat: 3
        step: 20
        event: {EventID: 4648, Channel: Security, SubjectUserName: workstation_x, TargetUserName: "acct${i}", TargetServerName: localhost, IpAddress: 127.0.0.1}
  - name: negative_own_account_does_not_count
    expect_incidents: []
    events:
      - repeat: 4
        step: 10
        event: {EventID: 4648, Channel: Security, SubjectUserName: workstation_x, TargetUserName: workstation_x, TargetServerName: localhost}
      - at: 60
        repeat: 2
        step: 10
        event: {EventID: 4648, Channel: Security, SubjectUserName: workstation_x, TargetUserName: "acct${i}", TargetServerName: localhost}
  - name: negative_machine_account_subject
    expect_incidents: []
    events:
      - repeat: 5
        step: 10
        event: {EventID: 4648, Channel: Security, SubjectUserName: "${host}$", TargetUserName: "acct${i}", TargetServerName: localhost}
lab:
  - 'foreach ($u in "acct1","acct2","acct3") { cmd /c "net use \\127.0.0.1\IPC$ /delete /y >nul 2>&1 & net use \\127.0.0.1\IPC$ /user:$env:COMPUTERNAME\$u Nope123!" 2>$null | Out-Null }'
