title: User Added to Local Administrator Group
id: 6c03bc37-ac29-448b-bc8e-78c9f7ed7640
name: auth_user_added_local_admins
related:
    - id: c265cf08-3f99-46c1-8d59-328247057d57
      type: derived
status: stable
description: |
    Detects the addition of a new member to the local administrator group, which could be legitimate activity or a sign of privilege escalation activity.
    Adapted for the SIEM: explicit Channel guard and the localized (Russian) group name prefix; the SID branch is locale independent.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4732
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers
author: Florian Roth (Nextron Systems), ET, Claude
date: 2017-03-14
modified: 2026-09-14
tags:
    - attack.initial-access
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078
    - attack.persistence
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_eid:
        Channel: Security
        EventID: 4732
    selection_group:
        - TargetUserName|startswith:
              - 'Administr'
              - 'Администр'
        - TargetSid: 'S-1-5-32-544'
    filter_main_computer_accounts:
        SubjectUserName|endswith: '$'
    condition: all of selection_* and not 1 of filter_*
falsepositives:
    - Legitimate administrative activity
level: medium
