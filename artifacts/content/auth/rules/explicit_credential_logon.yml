title: Logon Attempt With Explicit Credentials Of Another User
id: b06db85e-79ad-4b8a-98aa-f0f3c6dbc141
name: auth_explicit_credentials
related:
    - id: e3c6d245-7b8f-4e2a-c17f-a9d0e5b38f62
      type: derived
status: experimental
description: |
    A process used explicit credentials (4648) of a user different from the current one. The original rule only looks at
    localhost targets; this variant keeps any target and serves as a building block for "one account tries several
    other accounts" hunting. On the lab stack 4648 arrives without ProcessName, so filtering by process path is not possible.
references:
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4648
author: Swachchhanda Shrawan Poudel (Nextron Systems), ET, Claude
date: 2026-07-23
modified: 2026-09-14
tags:
    - attack.privilege-escalation
    - attack.lateral-movement
    - attack.t1078
    - attack.t1134.003
logsource:
    product: windows
    service: security
detection:
    selection:
        Channel: Security
        EventID: 4648
    filter_main_computer_accounts:
        SubjectUserName|endswith: '$'
    filter_main_same_user:
        SubjectUserName|fieldref: TargetUserName
    filter_main_empty_subject:
        SubjectUserName:
            - '-'
            - ''
    condition: selection and not 1 of filter_main_*
falsepositives:
    - RunAs and administrative tools using alternate credentials
level: informational
