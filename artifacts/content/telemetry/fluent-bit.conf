# Fluent Bit на стенде win10-lab -> soc_agent /ingest/stream.
# База - docs/guide/windows-vm-lab.md §4; здесь добавлены каналы под детект-контент и фильтр шума.
# Токен источника подставить в Header (UI -> "Источник данных" -> "Создать источник").

[SERVICE]
    Flush        2
    Log_Level    info
    Log_File     C:\ProgramData\fluent-bit\fluent-bit.log

[INPUT]
    Name                    winevtlog
    # Defender     - SCE_Evasion_Defender_Tampering (5001/5007), угрозы (1116/1117)
    # WMI-Activity - WMI-персистентность дополнительно к Sysmon 19-21
    # TaskScheduler, Bits-Client - контекст для расследования (задачи, BITS-загрузки)
    Channels                Security,System,Microsoft-Windows-Sysmon/Operational,Microsoft-Windows-PowerShell/Operational,Microsoft-Windows-Windows Defender/Operational,Microsoft-Windows-WMI-Activity/Operational,Microsoft-Windows-TaskScheduler/Operational,Microsoft-Windows-Bits-Client/Operational
    Interval_Sec            1
    DB                      C:\ProgramData\fluent-bit\winevtlog.sqlite
    Read_Existing_Events    false
    Event_Data_As_Map       true
    String_Inserts          false
    Ignore_Missing_Channels true

# Шум без ценности для детекта и расследования (замер на стенде - ~20% объёма):
#   4673/4674 - использование конфиденциальных прав (десятки в минуту на простое)
#   5379      - чтение учётных данных из Credential Manager (фоновые службы)
# Подкатегории auditpol с ними выключать нельзя: в тех же подкатегориях 4720/4732 и т.д.
# ПРОВЕРИТЬ на стенде: grep сравнивает строковое представление поля - если EventID приходит
# числом и фильтр не срабатывает, счётчики в GET /events/group?group_by=EventID это покажут.
[FILTER]
    Name       grep
    Match      *
    Logical_Op or
    Exclude    EventID ^4673$
    Exclude    EventID ^4674$
    Exclude    EventID ^5379$

[OUTPUT]
    Name             http
    Match            *
    Host             192.168.56.1
    Port             8000
    URI              /ingest/stream
    Format           json_lines
    json_date_key    EventTime
    json_date_format iso8601
    Header           Authorization Bearer <ТОКЕН>
    Retry_Limit      False
    net.keepalive    off
