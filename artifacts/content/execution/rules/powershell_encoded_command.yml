title: Suspicious Encoded PowerShell Command Line
id: 9f325258-d0ca-422f-a649-f31abbe2762b
name: exec_ps_encoded_command
related:
    -   id: ca2092a1-c273-4878-9b4b-0d60115bf5ea
        type: derived
status: test
description: Detects suspicious powershell process starts with base64 encoded commands (e.g. Emotet)
references:
    - https://app.any.run/tasks/6217d77d-3189-4db2-a957-8ab239f3e01e
author: Florian Roth (Nextron Systems), Markus Neis, Jonhnathan Ribeiro, Daniil Yugoslavskiy, Anton Kutepov, oscd.community, ET, Claude
date: '2018-09-03'
modified: '2026-09-14'
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith:
                - \powershell.exe
                - \pwsh.exe
        -   OriginalFileName:
                - PowerShell.EXE
                - pwsh.dll
    selection_cli_enc:
        CommandLine|contains: ' -e'
    selection_cli_content:
        CommandLine|contains:
            - ' JAB'
            - ' SUVYI'
            - ' SQBFAFgA'
            - ' aQBlAHgA'
            - ' aWV4I'
            - ' IAA'
            - ' IAB'
            - ' UwB'
            - ' cwB'
    selection_standalone:
        CommandLine|contains:
            - '.exe -ENCOD '
            - ' BA^J e-'
    filter_optional_remote_signed:
        CommandLine|contains: ' -ExecutionPolicy remotesigned '
    condition: guard_logsource and (selection_img and (all of selection_cli_* or selection_standalone) and not 1 of filter_optional_*)
level: high
