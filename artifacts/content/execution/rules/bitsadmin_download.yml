title: File Download Via Bitsadmin
id: 9f7dd731-97aa-454e-80cf-aeedeede3760
name: exec_bitsadmin_download
related:
    -   id: d059842b-6b9d-4ed1-b5c3-5b89143c6ede
        type: derived
status: test
description: Detects usage of bitsadmin downloading a file
references:
    - https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin
    - https://isc.sans.edu/diary/22264
    - https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
author: Michael Haag, FPT.EagleEye, ET, Claude
date: '2017-03-09'
modified: '2026-09-14'
tags:
    - attack.persistence
    - attack.execution
    - attack.stealth
    - attack.t1197
    - attack.s0190
    - attack.t1036.003
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith: \bitsadmin.exe
        -   OriginalFileName: bitsadmin.exe
    selection_cmd:
        CommandLine|contains: ' /transfer '
    selection_cli_1:
        CommandLine|contains:
            - ' /create '
            - ' /addfile '
    selection_cli_2:
        CommandLine|contains: http
    condition: guard_logsource and (selection_img and (selection_cmd or all of selection_cli_*))
falsepositives:
    - Some legitimate apps use this, but limited.
level: medium
