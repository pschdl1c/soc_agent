title: Suspicious Invoke-WebRequest Execution
id: b3328241-b558-43c4-a8a4-a149f48327cd
name: exec_ps_iwr_download
related:
    -   id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
        type: derived
    -   id: 5e3cc4d8-3e68-43db-8656-eaaeefdec9cc
        type: derived
status: test
description: Detects a suspicious call to Invoke-WebRequest cmdlet where the and output is located in a suspicious location
references:
    - https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
author: Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: '2022-08-02'
modified: '2026-09-14'
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        -   Image|endswith:
                - \powershell_ise.exe
                - \powershell.exe
                - \pwsh.exe
        -   OriginalFileName:
                - powershell_ise.EXE
                - PowerShell.EXE
                - pwsh.dll
    selection_commands:
        CommandLine|contains:
            - 'curl '
            - Invoke-WebRequest
            - 'iwr '
            - 'wget '
    selection_flags:
        CommandLine|contains:
            - ' -ur'
            - ' -o'
    selection_susp_locations:
        CommandLine|contains|expand: '%exec_ps_download_target_paths%'
    condition: guard_logsource and (all of selection_*)
falsepositives:
    - Unknown
level: high
