title: Remote Access Tool Services Have Been Installed - Security
id: 0edea9ac-9414-4ac2-90e5-5dd993a04110
name: exec_rmm_service_install
related:
    -   id: 1a31b18a-f00c-4061-9900-f735b96c99fc
        type: similar
    -   id: c8b00925-926c-47e3-beea-298fd563728e
        type: derived
status: test
description: Detects service installation of different remote access tools software. These software are often abused by threat actors to perform
references:
    - https://redcanary.com/blog/misbehaving-rats/
author: Connor Martin, Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: '2022-12-23'
modified: '2026-09-14'
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.execution
    - attack.t1543.003
    - attack.t1569.002
logsource:
    product: windows
    service: security
    definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
detection:
    guard_logsource:
        Channel: Security
        EventID: 4697
    selection:
        EventID: 4697
        ServiceName|contains|expand: '%exec_rmm_service_names%'
    condition: guard_logsource and (selection)
falsepositives:
    - The rule doesn't look for anything suspicious so false positives are expected. If you use one of the tools mentioned, comment it out
level: medium
