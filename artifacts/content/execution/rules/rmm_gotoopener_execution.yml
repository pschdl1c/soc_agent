title: Remote Access Tool - GoToAssist Execution
id: 880b33d0-707b-4fd5-8853-a2f330bcf618
name: exec_rmm_gotoopener
related:
    -   id: b6d98a4f-cef0-4abf-bbf6-24132854a83d
        type: derived
status: test
description: |
    An adversary may use legitimate desktop support and remote access software, such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an interactive command and control channel to target systems within networks.
    These services are commonly used as legitimate technical support software, and may be allowed by application control within a target environment.
    Remote access tools like VNC, Ammyy, and Teamviewer are used frequently when compared with other legitimate software commonly used by adversaries. (Citation: Symantec Living off the Land)
    Adapted for the SIEM: the Company "LogMeIn, Inc." branch is dropped - it matches every LogMeIn product and belongs to
    "Remote Access Tool - LogMeIn Execution", which in turn excludes GoTo Opener. One start is one indicator in
    SCE_Exec_Remote_Access_Tool.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-4---gotoassist-files-detected-test-on-windows
author: frack113, ET, Claude
date: '2022-02-13'
modified: '2026-09-16'
tags:
    - attack.command-and-control
    - attack.t1219.002
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection:
        -   Description: GoTo Opener
        -   Product: GoTo Opener
    condition: guard_logsource and (selection)
falsepositives:
    - Legitimate use
level: medium
