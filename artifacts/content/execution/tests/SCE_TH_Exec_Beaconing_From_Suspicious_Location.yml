scenario: SCE_TH_Exec_Beaconing_From_Suspicious_Location
cases:
  - name: positive_public_folder_implant_checkins
    expect_incidents: [th_exec_beaconing]
    events:
      - repeat: 12
        step: 30
        event: {EventID: 3, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Users\Public\Music\svc.exe', ProcessGuid: "${guid1}", Initiated: 1, DestinationIp: 198.51.100.77, DestinationPort: 443, DestinationHostname: c2.example-cdn.net}
  - name: negative_nine_checkins
    expect_incidents: []
    events:
      - repeat: 9
        step: 30
        event: {EventID: 3, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Users\Public\Music\svc.exe', ProcessGuid: "${guid1}", Initiated: 1, DestinationIp: 198.51.100.77, DestinationPort: 443}
  - name: negative_checkins_spread_over_processes
    expect_incidents: []
    events:
      - repeat: 12
        step: 30
        vary:
          ProcessGuid: ["${guid1}", "${guid2}", "${guid3}"]
        event: {EventID: 3, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Users\Public\Music\svc.exe', Initiated: 1, DestinationIp: 198.51.100.77, DestinationPort: 443}
  - name: negative_program_files_process
    expect_incidents: []
    events:
      - repeat: 15
        step: 20
        event: {EventID: 3, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files\Agent\agent.exe', ProcessGuid: "${guid1}", Initiated: 1, DestinationIp: 198.51.100.77, DestinationPort: 443}
lab:
  # ОДИН процесс на 12 соединений, а не цикл из 12 запусков: корреляция ключуется по ProcessGuid
  # (модель импланта, который сам стучится 10 раз за 10 минут), и у цикла счёт был по 1 на процесс -
  # порог не брался никогда. `Connection: close` заставляет curl открывать новое TCP-соединение на
  # каждый URL, иначе он переиспользует одно.
  # Цель - сам SIEM ($SiemUrl - переменная раннера, Invoke-Expression исполняет строку в его
  # области видимости): Sysmon пишет EID 3 только по УСТАНОВЛЕННОМУ соединению, а напрямую наружу
  # стенд не ходит (интернет через прокси на хосте) - проверено, соединение к 1.1.1.1 не дало
  # события вообще. Назначение на детект не влияет: правило смотрит на каталог образа.
  - 'Copy-Item C:\Windows\System32\curl.exe C:\Users\Public\Music\svc.exe -Force; $u = 1..12 | ForEach-Object { "$SiemUrl/health?beacon=$_" }; & C:\Users\Public\Music\svc.exe -s -o NUL -m 3 -H "Connection: close" @u'
