scenario: SCE_Exec_Remote_Access_Tool
cases:
  - name: positive_anydesk_exec_and_dns
    expect_incidents: [exec_remote_access_tool]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\ProgramData\AnyDesk.exe', Product: AnyDesk, Description: AnyDesk, Company: philandro Software GmbH, ParentImage: 'C:\Windows\System32\cmd.exe'}
      - at: 20
        event: {EventID: 22, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\ProgramData\AnyDesk.exe', QueryName: relay-8f3a.net.anydesk.com, QueryStatus: "0"}
  - name: positive_service_install_and_screenconnect
    expect_incidents: [exec_remote_access_tool]
    events:
      - event: {EventID: 4697, Channel: Security, ServiceName: 'ScreenConnect Client (1a2b3c)', ServiceFileName: 'C:\Program Files (x86)\ScreenConnect Client\ScreenConnect.ClientService.exe', SubjectUserName: workstation_x}
      - at: 30
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files (x86)\ScreenConnect Client\ScreenConnect.ClientService.exe', Product: ScreenConnect, Description: ScreenConnect Service}
      - at: 31
        event: {EventID: 4697, Channel: Security, ServiceName: 'AnyDesk', ServiceFileName: 'C:\Program Files (x86)\AnyDesk\AnyDesk.exe'}
  - name: positive_netsupport_and_ultraviewer
    expect_incidents: [exec_remote_access_tool]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\ProgramData\nsm\PCICFGUI.EXE', OriginalFileName: PCICFGUI.EXE, Product: NetSupport Remote Control, Company: NetSupport Ltd, Description: NetSupport Client Configurator}
      - at: 120
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files (x86)\UltraViewer\UltraViewer_Desktop.exe', OriginalFileName: UltraViewer_Desktop.exe, Product: UltraViewer, Company: 'DucFabulous Co,ltd'}
  - name: positive_simplehelp_and_logmein
    expect_incidents: [exec_remote_access_tool]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\ProgramData\JWrapper-Remote Access\JWAppsSharedConfig\SimpleService.exe', Product: SimpleService}
      - at: 300
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files (x86)\LogMeIn\x64\LMIGuardianSvc.exe', Description: LMIGuardianSvc, Product: LMIGuardianSvc, Company: 'LogMeIn, Inc.'}
  - name: positive_gotoassist_and_rmm_dns
    expect_incidents: [exec_remote_access_tool]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Users\victim\Downloads\GoTo Opener.exe', Description: GoTo Opener, Product: GoTo Opener, Company: 'LogMeIn, Inc.'}
      - at: 15
        event: {EventID: 22, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Users\victim\Downloads\GoTo Opener.exe', QueryName: relay-8f3a.net.anydesk.com, QueryStatus: "0"}
  - name: negative_single_goto_opener_start
    # у GoTo Opener Company = LogMeIn, Inc.: один запуск не должен давать два индикатора
    expect_incidents: []
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Users\victim\Downloads\GoTo Opener.exe', Description: GoTo Opener, Product: GoTo Opener, Company: 'LogMeIn, Inc.'}
  - name: negative_single_indicator_repeated
    expect_incidents: []
    events:
      - repeat: 3
        step: 60
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files (x86)\AnyDesk\AnyDesk.exe', Product: AnyDesk}
  - name: negative_browser_resolves_domain
    expect_incidents: []
    events:
      - event: {EventID: 22, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe', QueryName: client.teamviewer.com}
      - at: 10
        event: {EventID: 22, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Program Files\Mozilla Firefox\firefox.exe', QueryName: net.anydesk.com}
lab:
  # Сначала гасим AnyDesk от прошлого прогона: он держит C:\ProgramData\AnyDesk.exe, и повторный
  # Invoke-WebRequest падал с «file is being used by another process» - строка обрывалась целиком,
  # Start-Process не выполнялся, инцидента не было при исправном детекте.
  # Пауза перед завершением обязательна: корреляция требует ДВА разных индикатора RMM за час
  # (temporal gte 2), второй даёт DNS-запрос AnyDesk к своему домену от не-браузера. Убьёшь сразу -
  # останется один индикатор. В конце гасим снова, чтобы не оставлять на стенде работающее
  # средство удалённого доступа.
  - 'Get-Process AnyDesk -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 2; Invoke-WebRequest https://download.anydesk.com/AnyDesk.exe -OutFile C:\ProgramData\AnyDesk.exe; Start-Process C:\ProgramData\AnyDesk.exe; Start-Sleep 20; Get-Process AnyDesk -ErrorAction SilentlyContinue | Stop-Process -Force'
