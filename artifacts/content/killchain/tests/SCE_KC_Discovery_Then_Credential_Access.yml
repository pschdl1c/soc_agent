scenario: SCE_KC_Discovery_Then_Credential_Access
cases:
  - name: positive_recon_then_hive_dump
    expect_incidents: [kc_discovery_then_credential_access, recon_scripted_discovery, cred_registry_hive_dump]
    events:
      - repeat: 4
        step: 10
        vary:
          Image: ['C:\Windows\System32\whoami.exe', 'C:\Windows\System32\ipconfig.exe', 'C:\Windows\System32\systeminfo.exe', 'C:\Windows\System32\net.exe']
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, ParentProcessGuid: "${guid1}", ParentImage: 'C:\Windows\System32\cmd.exe'}
      - at: 900
        event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\reg.exe', OriginalFileName: reg.exe, CommandLine: 'reg save HKLM\SAM C:\Users\Public\sam.save', ParentImage: 'C:\Windows\System32\cmd.exe'}
  - name: negative_dump_without_recon
    expect_incidents: [cred_registry_hive_dump]
    events:
      - event: {EventID: 1, Channel: Microsoft-Windows-Sysmon/Operational, Image: 'C:\Windows\System32\reg.exe', OriginalFileName: reg.exe, CommandLine: 'reg save HKLM\SAM C:\Users\Public\sam.save', ParentImage: 'C:\Windows\System32\cmd.exe'}
lab:
  - 'Лаб-команды SCE_Recon_Scripted_Discovery, затем SCE_Cred_Registry_Hive_Dump'
