title: Hacktool Detected
id: 022ad4da-6b6e-4e89-8187-f3fdfbf31e50
status: experimental
description: >
  Detects execution of well-known offensive security, credential access,
  network discovery, interception, password auditing, exploitation, tunneling,
  and post-exploitation tools on Windows and Linux by executable path or a
  distinctive script name in the command line. Legitimate security testing and
  administrator activity must be allowlisted for the monitored environment.
author: Artem
date: 2026-08-07
references:
  - https://attack.mitre.org/software/S0002/
  - https://attack.mitre.org/software/S0029/
tags:
  - attack.credential-access
  - attack.discovery
  - attack.lateral-movement
  - attack.command-and-control

logsource:
  category: process_creation

detection:
  selection_image:
