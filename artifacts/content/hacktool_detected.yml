  # Safe inactive placeholders. Replace values or add new filter_* blocks.
  filter_authorized_exact_path_image:
    Image:
      - 'C:\__NO_DEFAULT_ALLOWLIST__\hacktool.exe'
      - '/__NO_DEFAULT_ALLOWLIST__/hacktool'

  filter_authorized_exact_path_new_process_name:
    NewProcessName:
      - 'C:\__NO_DEFAULT_ALLOWLIST__\hacktool.exe'
      - '/__NO_DEFAULT_ALLOWLIST__/hacktool'

  condition: >
    (selection_image or selection_new_process_name or
    selection_distinctive_script_commandline) and not 1 of filter_*

falsepositives:
  - Authorized penetration tests, red-team exercises and security training labs
  - Network troubleshooting or packet analysis by administrators or security personnel
  - Incident response, forensic activity and vulnerability assessment
level: high
