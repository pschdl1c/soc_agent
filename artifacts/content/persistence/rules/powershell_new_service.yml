title: New Service Creation Using PowerShell
id: beb3d441-90d6-4228-9b1a-16d9760e2607
name: persist_ps_new_service
related:
    -   id: 85ff530b-261d-48c6-a441-facaa2e81e48
        type: similar
    -   id: c02e96b7-c63a-4c47-bd83-4a9f74afcfb2
        type: derived
status: test
description: Detects the creation of a new service using powershell.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md
author: Timur Zinniatullin, Daniil Yugoslavskiy, oscd.community, ET, Claude
date: '2023-02-20'
modified: '2026-09-14'
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection:
        CommandLine|contains|all:
            - New-Service
            - -BinaryPathName
    condition: guard_logsource and (selection)
falsepositives:
    - Legitimate administrator or user creates a service for legitimate reasons.
    - Software installation
level: low
