title: Suspicious Scheduled Task Creation
id: 04965681-ea5e-4ee4-972f-84b483d44971
name: persist_task_suspicious_4698
related:
    -   id: 3a734d25-df5c-4b99-8034-af1ddb5883a4
        type: derived
status: test
description: Detects suspicious scheduled task creation events. Based on attributes such as paths, commands line flags, etc.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
author: Nasreddine Bencherchali (Nextron Systems), ET, Claude
date: '2022-12-05'
modified: '2026-09-14'
tags:
    - attack.execution
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    service: security
    definition: The Advanced Audit Policy setting Object Access > Audit Other Object Access Events has to be configured to allow this detection. We also recommend extracting the Command field from the embedded XML in the event data.
detection:
    guard_logsource:
        Channel: Security
        EventID: 4698
    selection_eid:
        EventID: 4698
    selection_paths:
        TaskContent|contains|expand: '%persist_task_susp_paths%'
    selection_commands:
        TaskContent|contains:
            - regsvr32
            - rundll32
            - cmd.exe</Command>
            - cmd</Command>
            - '<Arguments>/c '
            - '<Arguments>/k '
            - '<Arguments>/r '
            - powershell
            - pwsh
            - mshta
            - wscript
            - cscript
            - certutil
            - bitsadmin
            - bash.exe
            - 'bash '
            - scrcons
            - 'wmic '
            - wmic.exe
            - forfiles
            - scriptrunner
            - hh.exe
    condition: guard_logsource and (all of selection_*)
falsepositives:
    - Unknown
level: high
