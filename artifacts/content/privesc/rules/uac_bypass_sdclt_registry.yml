title: UAC Bypass via Sdclt
id: f66c2852-ff08-4972-bbe9-a59a62d6fe24
name: privesc_uac_sdclt_registry
related:
    -   id: 5b872a46-3b90-45c1-8419-f675db8053aa
        type: derived
status: test
description: Detects the pattern of UAC Bypass using registry key manipulation of sdclt.exe (e.g. UACMe 53)
references:
    - https://enigma0x3.net/2017/03/17/fileless-uac-bypass-using-sdclt-exe/
    - https://github.com/hfiref0x/UACME
author: Omer Yampel, Christian Burkard (Nextron Systems), ET, Claude
date: '2017-03-17'
modified: '2026-09-14'
tags:
    - attack.privilege-escalation
    - attack.t1548.002
    - car.2019-04-001
logsource:
    category: registry_set
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 13
    selection1:
        TargetObject|endswith: Software\Classes\exefile\shell\runas\command\isolatedCommand
    selection2:
        TargetObject|endswith: Software\Classes\Folder\shell\open\command\SymbolicLinkValue
        Details|re: -1[0-9]{3}\\Software\\Classes\\
    condition: guard_logsource and (1 of selection*)
falsepositives:
    - Unknown
level: high
