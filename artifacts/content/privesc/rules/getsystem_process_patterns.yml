title: Potential Meterpreter/CobaltStrike Activity
id: 3eb779ce-fe67-44cf-a4ad-37a5574ef509
name: privesc_getsystem_process
related:
    -   id: 15619216-e993-4721-b590-4c520615a67d
        type: derived
status: test
description: Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting a specific service starting
references:
    - https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
    - https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
author: Teymur Kheirkhabarov, Ecco, Florian Roth, ET, Claude
date: '2019-10-26'
modified: '2026-09-14'
tags:
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1134.001
    - attack.t1134.002
logsource:
    category: process_creation
    product: windows
detection:
    guard_logsource:
        Channel: Microsoft-Windows-Sysmon/Operational
        EventID: 1
    selection_img:
        ParentImage|endswith: \services.exe
    selection_technique_1:
        CommandLine|contains|all:
            - /c
            - echo
            - \pipe\
        CommandLine|contains:
            - cmd
            - '%COMSPEC%'
    selection_technique_2:
        CommandLine|contains|all:
            - rundll32
            - .dll,a
            - '/p:'
    filter_defender:
        CommandLine|contains: MpCmdRun
    condition: guard_logsource and (selection_img and 1 of selection_technique_* and not 1 of filter_*)
falsepositives:
    - Commandlines containing components like cmd accidentally
    - Jobs and services started with cmd
level: high
